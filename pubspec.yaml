name: luciq_http_client
description:
  This package is an add on to instabug_flutter. It intercepts any requests performed
  with http Package and sends them to the report that will be sent to the dashboard.
version: 3.0.0
publish_to: http://nexus.gojitsu.com:7777
homepage: https://github.com/gojitsucom/Instabug-Dart-http-Adapter.git
axlehire_project_type: package

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  luciq_flutter: ^18.0.0
  meta: ^1.10.0

dev_dependencies:
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
  mockito: '>=5.2.0 <5.5.0'
